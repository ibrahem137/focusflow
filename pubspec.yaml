name: focus_flow
description: "FocusFlow: meaningful tasks, deep focus and a growing garden."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter

 
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

 
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8


flutter:
  uses-material-design: true

  assets:
    - assets/branding/app_icon.png
    - assets/branding/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#7C3AED"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#090711"


  color_dark: "#090711"


  android: true
  ios: false
  web: false

  android_gravity: center

  android_12:
    color: "#090711"
    image: assets/branding/splash_transparent.png
    color_dark: "#090711"
    image_dark: assets/branding/splash_transparent.png
